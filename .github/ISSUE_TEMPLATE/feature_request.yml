name: Richiesta di funzionalità
description: Proponi una funzione nuova o un miglioramento
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema che risolve
      description: Cosa manca oggi e perché serve
    validations:
      required: true

  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Come dovrebbe funzionare la funzione
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: Alternative considerate
      description: Altre strade che hai valutato e perché non bastano
