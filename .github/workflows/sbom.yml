name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom:
    name: Genera, firma e attesta l'SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Installa cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: mediateca.spdx.json
          output-file: mediateca.spdx.json
          upload-release-assets: true

      - name: Firma l'SBOM con Sigstore (keyless)
        run: cosign sign-blob --yes --bundle mediateca.spdx.json.sigstore.json mediateca.spdx.json

      - name: Allega la firma alla release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" mediateca.spdx.json.sigstore.json --clobber

      - name: Provenance SLSA dell'SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: mediateca.spdx.json
