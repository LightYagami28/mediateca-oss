image: mcr.microsoft.com/dotnet/sdk:11.0

stages:
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

build:
  stage: build
  script:
    - dotnet restore tests/Mediateca.Tests/Mediateca.Tests.csproj --locked-mode
    - dotnet build tests/Mediateca.Tests/Mediateca.Tests.csproj --no-restore -c Release
  artifacts:
    paths:
      - tests/Mediateca.Tests/bin/
      - tests/Mediateca.Tests/obj/
    expire_in: 1 hour

test:
  stage: test
  script:
    - dotnet test tests/Mediateca.Tests/Mediateca.Tests.csproj --no-build -c Release
